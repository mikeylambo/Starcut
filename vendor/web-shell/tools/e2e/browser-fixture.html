<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><title>SLU E2E</title></head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <script type="module">
    import {createGameApp,createArcadeAssembly,DOMAdapter} from "/dist/index.js";
    const app=await createGameApp({
      gameId:"slu-e2e",
      gameName:"SLU E2E",
      version:"1.1.0",
      renderer:new DOMAdapter(document.getElementById("game")),
      root:document.getElementById("ui"),
      assemblies:[shell=>createArcadeAssembly({shell})]
    });
    globalThis.__SLU_E2E__={ready:true,app};
  </script>
</body>
</html>
